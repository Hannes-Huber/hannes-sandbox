name: Deploy Static Website

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- DEPLOY MAIN SITE ---
      # This takes everything inside your 'main-site' folder and pushes it
       Pentest-name: Deploy Main Site via rsync
        uses: AEnterprise/rsync-deploy@v1.0.2
        env:
          DEPLOY_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-avz --delete"
          SERVER_PORT: "22"
          FOLDER: "./main-site/"  # The folder in your GitHub repo
          SERVER_IP: ${{ secrets.SERVER_HOST }}
          USERNAME: ${{ secrets.SERVER_USER }}
          SERVER_DESTINATION: "/srv/projects/websites/homepage" # The folder on your server

      # --- DEPLOY SUBDOMAIN APP ---
      # This takes everything inside your 'subdomain-app-test' folder and pushes it
      - name: Deploy App 2 via rsync
        uses: AEnterprise/rsync-deploy@v1.0.2
        env:
          DEPLOY_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-avz --delete"
          SERVER_PORT: "22"
          FOLDER: "./subdomain-app-test/"  # The folder in your GitHub repo
          SERVER_IP: ${{ secrets.SERVER_HOST }}
          USERNAME: ${{ secrets.SERVER_USER }}
          SERVER_DESTINATION: "/srv/projects/websites/testproject" # The folder on your server
