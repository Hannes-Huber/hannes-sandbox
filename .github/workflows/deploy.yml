name: Build and Deploy Static Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-main-site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: main-site
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: main-site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          VITE_WORDPRESS_API_URL: ${{ vars.VITE_WORDPRESS_API_URL }}
        run: npm run build

      - name: Upload main site artifact
        uses: actions/upload-artifact@v4
        with:
          name: main-site-dist
          path: main-site/dist
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build-main-site
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download main site artifact
        uses: actions/download-artifact@v4
        with:
          name: main-site-dist
          path: main-site/dist

      - name: Deploy Main Site via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "main-site/dist/*"
          target: "/srv/projects/websites/homepage"
          strip_components: 2

      - name: Deploy App 2 via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "subdomain-app-test/*"
          target: "/srv/projects/websites/testproject"
          strip_components: 1
