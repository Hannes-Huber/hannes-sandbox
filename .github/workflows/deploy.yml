name: Deploy Static Website

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- DEPLOY MAIN SITE ---
      - name: Deploy Main Site via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "main-site/*"
          target: "/srv/projects/websites/homepage"
          strip_components: 1 # Prevents creating a "main-site" folder inside example.com

      # --- DEPLOY SUBDOMAIN APP ---
      - name: Deploy App 2 via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "subdomain-app-test/*"
          target: "/srv/projects/websites/testproject"
          strip_components: 1
